<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Open Requests</h1>
            {% if requests %}
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead>
                            <tr>
                                <th>Requestor Name</th>
                                <th>Requestor Contact</th>
                                <th>Items</th>
                                <th>Room</th>
                                <th>Tip</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for r in requests %}
                            <tr>
                                <td>{{ r[1] }}</td>
                                <td>{{ r[2] }}</td>
                                <td>{{ r[3] }}</td>
                                <td>{{ r[4] }}</td>
                                <td>{{ r[5] if r[5] else '-' }}</td>
                                <td>
                                    <form method="POST" action="{{ url_for('accept_request', request_id=r[0]) }}">
                                        <input type="text" name="helper_name" class="form-control" placeholder="Your Name" required>
                                        <input type="text" name="helper_contact" class="form-control" placeholder="Your Contact" required>
                                        <button type="submit" class="btn btn-accept btn-sm w-100 mt-2">Accept</button>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            {% else %}
                <p class="text-center text-muted">No open requests right now.</p>
            {% endif %}
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
