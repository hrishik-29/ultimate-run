<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Make a Request</h1>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger" role="alert">
                        <ul>
                            {% for message in messages %}
                                <li>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('request_item') }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ name if name else '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="room" class="form-label">Your Room Number</label>
                    <input type="text" class="form-control" id="room" name="room" value="{{ room if room else '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="contact" class="form-label">Your Contact</label>
                    <input type="text" class="form-control" id="contact" name="contact" value="{{ contact if contact else '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="items" class="form-label">Items Needed</label>
                    <textarea class="form-control" id="items" name="items" rows="3" required>{{ items if items else '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="tip" class="form-label">Tip (Optional)</label>
                    <input type="number" step="0.01" class="form-control" id="tip" name="tip">
                </div>
                <button type="submit" class="btn btn-custom w-100">Submit Request</button>
            </form>
            <div class="text-center btn-back">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
